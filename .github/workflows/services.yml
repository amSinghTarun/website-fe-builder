name: service
run-name: Build, publish, and deploy application images

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      recovery: ${{ steps.filter.outputs.recovery }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent:
              - 'services/agentServer/**'
              - 'packages/**'
            recovery:
              - 'services/recovery_cron/**'
              - 'packages/**'
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - 'k8s/apps/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'
              - 'k8s/apps/**'

  backend:
    name: Build, push, and deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-backend:latest
            tarunsingh28/sky-backend:${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: 'hundred-x-course'
          location: 'asia-southeast1'

      - name: Apply database migrations
        run: |
          # Infra and service workflows may run concurrently on a fresh cluster.
          kubectl rollout status deployment/sky-postgres --timeout=300s
          migration_job=sky-db-migrate-${GITHUB_SHA::12}
          migration_template=${migration_job}-template
          trap 'kubectl delete cronjob "$migration_template" --ignore-not-found' EXIT
          kubectl delete job "$migration_job" --ignore-not-found
          kubectl delete cronjob "$migration_template" --ignore-not-found
          kubectl create cronjob "$migration_template" \
            --image=tarunsingh28/sky-backend:${{ github.sha }} \
            --schedule='0 0 31 2 *' -- \
            sh -c 'cd /app/packages/db && bunx prisma migrate deploy'
          kubectl set env cronjob/"$migration_template" --from=secret/sky-secrets
          kubectl create job "$migration_job" --from=cronjob/"$migration_template"
          kubectl patch job "$migration_job" \
            --type=merge -p '{"spec":{"ttlSecondsAfterFinished":300}}'
          if ! kubectl wait --for=condition=complete job/"$migration_job" --timeout=180s; then
            kubectl logs job/"$migration_job"
            exit 1
          fi
          kubectl logs job/"$migration_job"
          kubectl delete job "$migration_job"

      - name: Pin backend image
        run: |
          kubectl set env deployment/sky-backend RUNTIME_IMAGE_TAG=${{ github.sha }}
          kubectl set image deployment/sky-backend backend=tarunsingh28/sky-backend:${{ github.sha }}
          kubectl rollout status deployment/sky-backend --timeout=180s

  frontend:
    name: Build, push, and deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-frontend:latest
            tarunsingh28/sky-frontend:${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: 'hundred-x-course'
          location: 'asia-southeast1'

      - name: Pin image
        run: |
          kubectl set image deployment/sky-frontend frontend=tarunsingh28/sky-frontend:${{ github.sha }}
          kubectl rollout status deployment/sky-frontend --timeout=180s

  agent:
    name: Build and push agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/agentServer/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-agent:latest
            tarunsingh28/sky-agent:${{ github.sha }}

  recovery:
    name: Build and push recovery-cron
    needs: changes
    if: needs.changes.outputs.recovery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/recovery_cron/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-recovery-cron:latest
            tarunsingh28/sky-recovery-cron:${{ github.sha }}
