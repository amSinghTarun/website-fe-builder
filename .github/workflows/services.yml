name: service
run-name: build and push servie and packages images

on:
  push:
    branches:
      - main
    # paths:
    #   - services
    #   - packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services_images:
    name: build and publish services image
    runs-on: ubuntu-latest
    steps:
      
      # The actions/checkout@v4 step downloads your source code from GitHub onto the virtual machine running your workflow
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push wsServer
        uses: docker/build-push-action@v7
        with:
          # file	String	Path to the Dockerfile. (default {context}/Dockerfile)
          context: .
          file: ./services/wsServer/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-ws-server:latest
            tarunsingh28/sky-ws-server:${{ github.sha }}

      - name: Build and push agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/agentServer/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-agent:latest
            tarunsingh28/sky-agent:${{ github.sha }}

      - name: Build and push recovery-cron
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/recovery_cron/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-recovery-cron:latest
            tarunsingh28/sky-recovery-cron:${{ github.sha }}

