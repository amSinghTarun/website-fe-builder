name: service
run-name: build and push servie and packages images

on:
  push:
    branches:
      - main
    # paths:
    #   - services
    #   - packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services_images:
    name: build and publish services image
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push wsServer
        uses: docker/build-push-action@v7
        with:
          # file	String	Path to the Dockerfile. (default {context}/Dockerfile)
          context: .
          file: ./services/wsServer/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-wsServer:latest
            tarunsingh28/wsServer:${{ github.sha }}

      - name: Build and push agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/agent/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-agent:latest
            tarunsingh28/agent:${{ github.sha }}

      - name: Build and push recovery-cron
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./services/recovery-cron/Dockerfile
          push: true
          tags: |
            tarunsingh28/sky-recovery-cron:latest
            tarunsingh28/recovery-cron:${{ github.sha }}

