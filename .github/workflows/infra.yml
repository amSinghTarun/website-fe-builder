# For auth
# https://github.com/google-github-actions/auth/blob/main/README.md#direct-wif

# authenticate to google cloud gcp from github actions using oidc and workload identity
# https://medium.com/@prasad.reddy0708/authenticate-to-google-cloud-gcp-from-github-actions-using-oidc-and-workload-identity-federation-2a6c6b56c29f

name: Deploy 
run-name: Deploy Kubernetes manifests

on:
  workflow_run:
    workflows: [service]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  job_1:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:

      - uses: 'actions/checkout@v7'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          
      # get kubernetes creds so that kubectl work
      - name: Get GKE Credentials
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: 'hundred-x-course'
          location: 'asia-southeast1'


      # Create the secrets in k8s for other deployments to use
      - name: Create secret in main cluster
        env:
          JWT_SECRET_FROM_GITHUB: ${{ secrets.JWT_SECRET }}
        run: |
          jwt_secret="$JWT_SECRET_FROM_GITHUB"
          if [ -z "$jwt_secret" ]; then
            jwt_secret="$(kubectl get secret sky-secrets --namespace=default \
              -o jsonpath='{.data.JWT_SECRET}' 2>/dev/null | base64 --decode || true)"
          fi
          if [ -z "$jwt_secret" ]; then
            jwt_secret="$(openssl rand -hex 32)"
          fi

          kubectl create secret generic sky-secrets --namespace=default \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_SECRET="$jwt_secret" \
            --from-literal=GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}" \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # deploy the docker images to k8s
      - name: Deploy apps
        run: |
          # Runtime RBAC is bootstrapped separately with a cluster-admin context.
          # The deployment identity intentionally cannot create or update RBAC.
          kubectl apply -f ./infra/pvc.yml
          kubectl apply -f ./infra/postgres.yml
          kubectl apply -f ./infra/dynamic_nginx/deployment.yml
          kubectl apply -f ./infra/apps/backend.yml
          kubectl apply -f ./infra/apps/frontend.yml
          kubectl apply -f ./infra/ingress.yml

      - name: Pin application images to this commit
        run: |
          kubectl set image deployment/sky-backend backend=tarunsingh28/sky-backend:${{ github.event.workflow_run.head_sha }}
          kubectl set image deployment/sky-frontend frontend=tarunsingh28/sky-frontend:${{ github.event.workflow_run.head_sha }}

      - name: Refresh existing project services
        run: |
          # Both proxies mount ConfigMap files via subPath and need an explicit
          # restart to observe configuration changes.
          kubectl rollout restart deployment/dynamic-nginx deployment/nginx-proxy

          for deployment in $(kubectl get deployment -o name); do
            case "$deployment" in
              *-agent-deployment)
                kubectl set env "$deployment" \
                  CONTEXT_ARCHIVE_PATH=/user-app/.sky-agent-context \
                  WORKSPACE_CONTAINER_PATH=/app/my-app
                kubectl rollout restart "$deployment"
                ;;
              *-recovery|*-recovery-cron-deployment|*-ws-server-deployment)
                kubectl rollout restart "$deployment"
                ;;
            esac
          done

      - name: Wait for Postgres
        run: |
          kubectl rollout status deployment/sky-postgres
          kubectl rollout status deployment/nginx-proxy
          kubectl rollout status deployment/dynamic-nginx
          kubectl rollout status deployment/sky-backend
          kubectl rollout status deployment/sky-frontend

      - name: Apply database migrations
        run: |
          kubectl exec deployment/sky-backend -- \
            sh -c 'cd /app/packages/db && bunx prisma migrate deploy'
