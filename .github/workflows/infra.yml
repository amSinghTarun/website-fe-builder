name: Infra
run-name: Deploy Kubernetes infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'k8s/infra/**'

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  apply_infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: 'hundred-x-course'
          location: 'asia-southeast1'

      - name: Create secret in main cluster
        env:
          JWT_SECRET_FROM_GITHUB: ${{ secrets.JWT_SECRET }}
          DATABASE_URL_FROM_GITHUB: ${{ secrets.DATABASE_URL }}
          GCP_PROJECT_ID_FROM_GITHUB: ${{ secrets.GCP_PROJECT_ID }}
          POSTGRES_USER_FROM_GITHUB: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD_FROM_GITHUB: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB_FROM_GITHUB: ${{ secrets.POSTGRES_DB }}
        run: ./scripts/github/infra/create_cluster_secret.sh

      - name: Apply manifests
        run: |
          # Runtime RBAC is bootstrapped separately with a cluster-admin context.
          # The deployment identity intentionally cannot create or update RBAC.
          kubectl apply -f ./k8s/infra/pvc.yml
          kubectl apply -f ./k8s/infra/postgres.yml
          kubectl apply -f ./k8s/infra/dynamic_nginx/deployment.yml
          kubectl apply -f ./k8s/apps/backend.yml
          kubectl apply -f ./k8s/apps/frontend.yml
          kubectl apply -f ./k8s/infra/ingress.yml
