apiVersion: v1
kind: ConfigMap
metadata:
  name: confnginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

      # Agent/API
      location ~ ^/agent/(?<runtime_id>[^/]+)(?<rest>/.*)?$ {
        proxy_buffering off;
        proxy_pass http://$runtime_id-agent-service.default.svc.cluster.local:3000$rest$is_args$args;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Workspace frontend
      location ~ ^/workspace/(?<runtime_id>[^/]+)(?<rest>/.*)?$ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve /workspace/<runtime_id>/ because Vite is started with that base.
        proxy_pass http://$runtime_id-workspace-service.default.svc.cluster.local:5173;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # WebSocket
      location ~ ^/ws/(?<runtime_id>[^/]+)$ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://$runtime_id-ws-server-service.default.svc.cluster.local:8080;
      }
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-nginx
  labels:
    app: dynamic-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-nginx
  template:
    metadata:
      labels:
        app: dynamic-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: confnginx

---

kind: Service
apiVersion: v1
metadata:
  name: nginx-custom
spec:
  selector:
    app: dynamic-nginx
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    name: nginx
