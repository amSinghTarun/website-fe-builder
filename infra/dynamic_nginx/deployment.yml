apiVersion: v1
kind: ConfigMap
metadata:
  name: confnginx
data:
  default.conf: | 
    server {
      listen 8080;

      server_name project.tarunn.co;
      resolver kube-dns.kube-system.svc.cluster.local valid=5s;

      # Agent/API
      location ~ ^/(?<project>[^/]+)$ {
        proxy_pass http://$project-agent.default.svc.cluster.local:3001;
        proxy_set_header Host $host;
      }

      # Workspace frontend
      location ~ ^/workspace/(?<project>[^/]+)(?<rest>/.*)?$ {
        proxy_pass http://$project-workspace.default.svc.cluster.local:5173$rest;
        proxy_set_header Host $host;
      }

      # WebSocket
      location ~ ^/ws/(?<project>[^/]+)$ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://$project-ws-server.default.svc.cluster.local:8080;
        proxy_set_header Host $host;
      }
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-nginx
  labels:
    app: dynamic-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-nginx
  template:
    metadata:
      labels:
        app: dynamic-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: confnginx

---

kind: Service
apiVersion: v1
metadata:
  name: nginx-custom
spec:
  selector:
    app: dynamic-nginx
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    name: nginx