server {
  listen 80;

  server_name ~^(?<subdomain>.*?)\.;
  resolver kube-dns.kube-system.svc.cluster.local valid=5s;

  location / {
    proxy_pass http://$subdomain.default.svc.cluster.local;
    proxy_set_header Host $host;
  }
}

server {
  listen 80;

  server_name lovable.com;
  resolver kube-dns.kube-system.svc.cluster.local valid=5s;

  location ~ ^/project/(?<subdomain>[^/]+)$ {
    proxy_pass http://agent_$subdomain.default.svc.cluster.local;
    proxy_set_header Host $host;
  }

  location ~ ^/ws/(?<subdomain>[^/]+)$ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass http://ws_$subdomain.default.svc.cluster.local;
    proxy_set_header Host $host;
  }
}