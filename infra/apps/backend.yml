apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-backend
  namespace: default
  labels:
    app: sky-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sky-backend
  template:
    metadata:
      labels:
        app: sky-backend
    spec:
      serviceAccountName: sky-backend-sa
      containers:
        - name: backend
          image: tarunsingh28/sky-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sky-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sky-secrets
                  key: JWT_SECRET
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: sky-secrets
                  key: GCP_PROJECT_ID
            - name: PROJECTS_BASE_URL
              value: http://project.tarun.co
            - name: CORS_ORIGINS
              value: http://sky.traun.co,https://sky.traun.co
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: sky-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
