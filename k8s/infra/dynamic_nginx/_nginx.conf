# Reference copy of the `confnginx` ConfigMap in deployment.yml.
server {
  listen 8080;
  server_name _;

  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

  location ~ ^/agent/(?<runtime_id>[^/]+)(?<rest>/.*)?$ {
    proxy_buffering off;
    proxy_pass http://$runtime_id-agent-service.default.svc.cluster.local:3000$rest$is_args$args;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/workspace/(?<runtime_id>[^/]+)(?<rest>/.*)?$ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Preserve /workspace/<runtime_id>/ because Vite uses that base path.
    proxy_pass http://$runtime_id-workspace-service.default.svc.cluster.local:5173;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

}
