apiVersion: v1
kind: ServiceAccount
metadata:
  name: sky-backend-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sky-backend-runtime-provisioner
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sky-backend-runtime-provisioner
  namespace: default
subjects:
  - kind: ServiceAccount
    name: sky-backend-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sky-backend-runtime-provisioner
